{% extends "base.html" %}

{% block title %}Edit Product{% endblock %}

{% block page_title %}Edit Product{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-7">

        <div class="card shadow">

            <div class="card-header bg-warning text-dark">

                <h4 class="mb-0">
                    <i class="bi bi-pencil-square"></i>
                    Edit Product
                </h4>

            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Product Name
                        </label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            value="{{ product[1] }}"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Category
                        </label>

                        <select
                            name="category_id"
                            class="form-select"
                            required>

                            {% for category in categories %}

                            <option
                                value="{{ category[0] }}"
                                {% if product[2] == category[0] %}selected{% endif %}>
                                {{ category[1] }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Quantity
                        </label>

                        <input
                            type="number"
                            name="quantity"
                            class="form-control"
                            value="{{ product[3] }}"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Price (₹)
                        </label>

                        <input
                            type="number"
                            step="0.01"
                            name="price"
                            class="form-control"
                            value="{{ product[4] }}"
                            required>

                    </div>

                    <button class="btn btn-success">
                        <i class="bi bi-check-circle"></i>
                        Update Product
                    </button>

                    <a href="/view_products" class="btn btn-secondary">
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
