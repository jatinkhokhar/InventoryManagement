{% extends "base.html" %}

{% block title %}
Add Product
{% endblock %}

{% block page_title %}
Add New Product
{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card shadow-lg border-0 rounded-4">

                <div class="card-header bg-primary text-white py-3">

                    <h4 class="mb-0">
                        <i class="bi bi-box-seam"></i>
                        Add New Product
                    </h4>

                </div>

                <div class="card-body p-4">

                    <form method="POST">

                        <!-- Product Name -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Product Name
                            </label>

                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                placeholder="Enter Product Name"
                                required>

                        </div>

                        <!-- Category -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Category
                            </label>

                            <select name="category_id" class="form-select" required>

                                {% for category in categories %}

                                <option value="{{ category[0] }}">
                                    {{ category[1] }}
                                </option>

                                {% endfor %}

                            </select>

                        </div>

                        <!-- Quantity -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Quantity
                            </label>

                            <input
                                type="number"
                                name="quantity"
                                class="form-control"
                                placeholder="Enter Quantity"
                                required>

                        </div>

                        <!-- Price -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Price (₹)
                            </label>

                            <input
                                type="number"
                                step="0.01"
                                name="price"
                                class="form-control"
                                placeholder="Enter Price"
                                required>

                        </div>

                        <div class="d-flex justify-content-between">

                            <button class="btn btn-success px-4">

                                <i class="bi bi-check-circle"></i>

                                Save Product

                            </button>

                            <a href="/view_products"
                               class="btn btn-secondary px-4">

                                Cancel

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
